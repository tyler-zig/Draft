name: Sync player intelligence

# The nflverse historical rebuild is the one job in this pipeline that cannot
# run on Supabase: Edge Functions cap CPU at 2s per request, and parsing one
# season of play-by-play alone costs ~9s of CPU before any of the usage or
# durability calculations run. Season projections live in sync-projections.yml
# for the same reason (FantasySharks Crawl-delay: 60). Rankings, ADP, the
# schedule and matchup refresh, and the sharded read path are published by
# pg_cron driving Edge Functions and need nothing from here.

on:
  schedule:
    # Tuesdays 09:00 UTC, after Monday Night Football has settled.
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to rebuild, comma separated (blank = current season only)'
        required: false
        type: string
      refresh:
        description: 'Re-download source CSVs even when cached'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-intelligence
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A cold run with no seed rebuilds all fifteen seasons; the default 360
    # minutes is far more than that needs, but the incremental case finishes in
    # a few minutes.
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DATA_BUCKET: ${{ secrets.SUPABASE_DATA_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail early if Supabase credentials are missing
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets."
            exit 1
          fi

      # Conditional requests are keyed off the .metadata.json files written
      # beside each download, so a warm cache means nflverse is asked for an
      # ETag check rather than the whole file.
      - name: Restore nflverse download cache
        uses: actions/cache@v4
        with:
          path: data/intelligence/raw/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Seed from the published artifact
        run: node scripts/fetch-intelligence-seed.mjs

      # The season to rebuild has to be named explicitly. `--refresh` on its own
      # rebuilds the newest season the seed knows about, and the seed cannot
      # know about a season that has not been played yet -- in August 2026 the
      # published artifact still ends at 2025, so bare `--refresh` would
      # helpfully rebuild the wrong year.
      - name: Resolve the season to rebuild
        id: season
        run: |
          if [ -n "${{ inputs.seasons }}" ]; then
            SEASON="${{ inputs.seasons }}"
          else
            # January and February still belong to the previous season year.
            SEASON=$(node -e 'const d=new Date();console.log(d.getUTCMonth()>=2?d.getUTCFullYear():d.getUTCFullYear()-1)')
          fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "Season(s) to rebuild: $SEASON"

      # nflverse publishes a season's files only once it has been played, and a
      # missing source is a hard download failure. Between February and the
      # first completed week of September there is nothing to rebuild, so the
      # run reports that and stops rather than failing every Tuesday until
      # kickoff.
      - name: Check nflverse has published this season
        id: available
        run: |
          FIRST=$(echo "${{ steps.season.outputs.season }}" | cut -d, -f1)
          URL="https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_$FIRST.csv"
          CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
          echo "HTTP $CODE for season $FIRST"
          if [ "$CODE" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nflverse has not published season $FIRST yet (HTTP $CODE); nothing to rebuild."
          fi

      # --refresh is what marks the requested seasons for rebuild; without it
      # the seeded slices are treated as already built and nothing changes.
      - name: Rebuild player history
        if: steps.available.outputs.ready == 'true'
        run: npm run sync:intelligence -- --refresh --seasons=${{ steps.season.outputs.season }}

      # Publishes latest.json, schedule.json and the 128 shard buckets. The
      # hosted cron republishes the shards too, so this is belt and braces
      # rather than the only path.
      - name: Publish to Supabase
        if: steps.available.outputs.ready == 'true'
        run: npm run upload:supabase

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Player intelligence sync"
            echo ""
            if [ "${{ steps.available.outputs.ready }}" = "true" ]; then
              echo "- Rebuilt season(s): \`${{ steps.season.outputs.season }}\`"
              echo "- Artifact: \`$(wc -c < public/intelligence/latest.json 2>/dev/null || echo 0)\` bytes"
              echo "- Shard buckets: \`$(ls public/intelligence/players/*.json 2>/dev/null | wc -l)\`"
            else
              echo "Skipped: nflverse has not published season \`${{ steps.season.outputs.season }}\` yet."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
